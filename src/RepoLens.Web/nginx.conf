server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API traffic is forwarded to the RepoLens.Api service of the compose stack
    # ("api" is the docker-compose service name; compose-internal DNS resolves it).
    location /health {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown non-file routes render index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
